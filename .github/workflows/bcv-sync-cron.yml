name: BCV Daily Exchange Rate Autonomous Sync

on:
  schedule:
    # 11:00 AM UTC = 7:00 AM VET (Venezuela Time UTC-4) todos los días
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  sync-rates:
    name: Sincronizar Tasas Oficiales BCV
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Cron de Sincronización
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'https://shopmarket.marketos.lat' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Sincronizando tasas oficiales BCV en $APP_URL..."
          AUTH_HEADER=""
          if [ -n "$CRON_SECRET" ]; then
            AUTH_HEADER="Authorization: Bearer $CRON_SECRET"
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" -X GET "$APP_URL/api/cron/bcv-sync" \
            ${AUTH_HEADER:+-H "$AUTH_HEADER"})

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_CODE"
          echo "Respuesta: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Sincronización completada exitosamente."
          else
            echo "Error en la sincronización de tasas oficiales (HTTP $HTTP_CODE)."
            exit 1
          fi
